# Gorgona Konfiguration - Format: KEY = VALUE, Kommentare mit '#'
#
# Abschnitte schraenken die nachfolgenden Eintraege ein:
#   [host <hostname>]      nur auf diesem Rechner (erster Name, kleingeschrieben)
#   [os <macos|linux|...>] nur auf diesem Betriebssystem
# Ohne Abschnitt gelten Eintraege immer (global).

port = 8080
workers = 4

# Testdaten: global, auf jedem Rechner verfuegbar
db.Testdaten = data/test.db

# Chinook: nur auf diesem Mac (Host "hepti") freigegeben
[host hepti]
db.Chinook = /Users/olf/Library/Application Support/TablePro/Samples/Chinook.sqlite
